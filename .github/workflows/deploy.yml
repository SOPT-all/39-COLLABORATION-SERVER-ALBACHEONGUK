name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: alba-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch로 main 외 브랜치를 선택했을 때는 배포하지 않는다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      APP_DIR: ${{ vars.ALBA_APP_DIR }}
      APP_SERVICE: ${{ vars.ALBA_SERVICE_NAME }}
      AWS_REGION: ap-northeast-2
      EC2_SECURITY_GROUP_ID: ${{ vars.ALBA_EC2_SECURITY_GROUP_ID }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build application
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: Configure SSH
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Set repository secret EC2_HOST}"
          : "${EC2_USER:?Set repository secret EC2_USER}"
          : "${EC2_SSH_PRIVATE_KEY:?Set repository secret EC2_SSH_PRIVATE_KEY}"
          : "${EC2_KNOWN_HOSTS:?Set repository secret EC2_KNOWN_HOSTS}"
          : "${APP_DIR:?Set repository variable ALBA_APP_DIR}"
          : "${APP_SERVICE:?Set repository variable ALBA_SERVICE_NAME}"
          if [[ ! "$APP_DIR" =~ ^/[A-Za-z0-9/_-]+$ ]]; then
            echo "ALBA_APP_DIR must be an absolute path using letters, numbers, /, _ or -." >&2
            exit 1
          fi
          if [[ ! "$APP_SERVICE" =~ ^[A-Za-z0-9_.@-]+$ ]]; then
            echo "ALBA_SERVICE_NAME contains unsupported characters." >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/alba_deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/alba_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/alba_deploy_key" >/dev/null

      - name: Authenticate to AWS
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ALBA_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: alba-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true

      - name: Allow this runner to connect over SSH
        run: python3 scripts/ec2/temporary_ssh.py open

      - name: Upload application and deploy script
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/alba_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          scp "${ssh_options[@]}" \
            build/libs/app.jar \
            "scripts/deploy.sh" \
            "$EC2_USER@$EC2_HOST:/tmp/"

      - name: Restart service and verify health
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/alba_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" \
            "bash /tmp/deploy.sh '$APP_DIR' '$APP_SERVICE' '/tmp/app.jar'"

      - name: Remove this run's temporary SSH access
        if: ${{ always() && steps.aws-auth.outcome == 'success' }}
        run: python3 scripts/ec2/temporary_ssh.py close

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/alba_deploy_key"

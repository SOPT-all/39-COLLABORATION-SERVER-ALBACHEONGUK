spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  datasource:
    url: jdbc:h2:mem:alba;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true